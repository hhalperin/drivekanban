appId: com.cline.kanban
productName: Kanban
copyright: Copyright © 2025 Cline

directories:
  output: out
  buildResources: build

afterSign: ./scripts/notarize.cjs

# `cli/**` is staged locally by the `stage:cli` npm script (electron-builder
# rejects files outside the package root). The asarUnpack glob below matches
# against this staged path, so rebasing with `from/to` would break unpacking.
files:
  - dist/**/*
  - package.json
  - cli/**/*
  - "!cli/**/*.map"
  - "!dist/**/*.map"

# Narrow filter — explicitly excludes `kanban-dev*` (dev-only shims) and
# any stray files in build/bin from accidentally shipping.
extraResources:
  - from: build/bin
    to: bin
    filter:
      - "kanban"
      - "kanban.cmd"

protocols:
  - name: Kanban
    schemes:
      - kanban

asar: true

# node-pty's spawn-helper + any native addons need a real filesystem path.
# `patch-node-pty.mjs` fixes up the helper-path resolution to match.
asarUnpack:
  - "cli/**"
  - "node_modules/node-pty/**"
  - "**/*.node"

# Update feed. Pinned explicitly rather than inferred from the git remote:
# an inferred provider silently publishing to whichever repo happens to be
# `origin` is a worse failure than one that needs a deliberate edit in a fork.
publish:
  provider: github
  owner: cline
  repo: kanban

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # The zip target is not optional — electron-updater cannot apply an update
  # from a DMG, so a mac build that ships only `dmg` has a working update
  # *check* and no working update. The DMG stays for first-time installs.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSAppSleepDisabled: true
    NSSupportsAutomaticTermination: false
    NSSupportsSuddenTermination: false

dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"

win:
  # 1024×1024 PNG extracted from icon.icns so every platform ships the same
  # artwork; electron-builder derives the .ico from it.
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  artifactName: "${productName}-${version}-${arch}-setup.${ext}"
  # Per-user install by default. A per-machine install needs elevation, and
  # electron-updater cannot apply an update to a location the running user
  # can't write — which would leave Windows users silently stuck on the
  # version they first installed.
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icon.png
  category: Development
  # Without this the binary is named after the npm package rather than the
  # product, and a scoped name sanitizes to `@kanbandesktop` — which lands in
  # the .desktop file's Exec and Icon fields and breaks icon lookup.
  executableName: kanban
  synopsis: A kanban foundation for coding agents
  # fpm refuses to build a .deb without a maintainer, and derives one from
  # `author` in package.json only when that field carries an email. Setting it
  # explicitly keeps the deb target working regardless of how the package
  # metadata is written.
  maintainer: Cline <support@cline.bot>
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  desktop:
    entry:
      # Without this the top-level `protocols` block registers `kanban://`
      # on macOS and Windows but not Linux, so deep links — including the
      # OAuth callback — would silently fail to reach the app there.
      MimeType: x-scheme-handler/kanban;

appImage:
  artifactName: "${productName}-${version}-${arch}.${ext}"

deb:
  artifactName: "${productName}-${version}-${arch}.${ext}"
