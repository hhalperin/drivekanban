<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kanban — Runtime Logs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1F2428;
    color: #E6EDF3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    font-size: 13px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid #30363D;
    background: #24292E;
    flex: 0 0 auto;
  }
  h1 { font-size: 13px; font-weight: 600; margin-right: auto; }
  button {
    background: #2D3339;
    color: #E6EDF3;
    border: 1px solid #444C56;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #353C43; }
  label { display: flex; align-items: center; gap: 6px; color: #8B949E; font-size: 12px; }
  #log {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 10px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    user-select: text;
  }
  .line { display: block; }
  .stderr { color: #F85149; }
  .empty { color: #6E7681; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Runtime Logs</h1>
  <label><input type="checkbox" id="follow" checked /> Follow</label>
  <button id="copy" type="button">Copy All</button>
  <button id="clear" type="button">Clear</button>
</header>
<div id="log"><span class="empty">Waiting for runtime output…</span></div>
<script>
  // The renderer for this window gets a dedicated preload exposing only
  // `window.runtimeLogs`. It deliberately shares nothing with the app's
  // bridge: this page must keep working when the runtime is down, which is
  // exactly when someone opens it.
  const logEl = document.getElementById("log");
  const followEl = document.getElementById("follow");
  let hasContent = false;

  function appendLine(line) {
    if (!hasContent) {
      logEl.textContent = "";
      hasContent = true;
    }
    const span = document.createElement("span");
    span.className = line.stream === "stderr" ? "line stderr" : "line";
    span.textContent = line.text;
    logEl.appendChild(span);
    if (followEl.checked) logEl.scrollTop = logEl.scrollHeight;
  }

  function render(lines) {
    logEl.textContent = "";
    hasContent = false;
    if (lines.length === 0) {
      const empty = document.createElement("span");
      empty.className = "empty";
      empty.textContent = "No runtime output captured yet.";
      logEl.appendChild(empty);
      return;
    }
    for (const line of lines) appendLine(line);
  }

  document.getElementById("copy").addEventListener("click", () => {
    window.runtimeLogs?.copyAll();
  });
  document.getElementById("clear").addEventListener("click", () => {
    window.runtimeLogs?.clear();
    render([]);
  });

  window.runtimeLogs?.getLines().then(render);
  window.runtimeLogs?.onLine(appendLine);
</script>
</body>
</html>
